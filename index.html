<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>이번주 토요일, 데이트 할래?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2b18;
    --ink-soft: #7a6647;
    --wax: #7c1f2e;
    --wax-dark: #4d1219;
    --gold: #b0863f;
    --paper: #ecdcb0;
    --paper-dark: #ddc691;
    --bg-top: #efe3c0;
    --bg-bottom: #f8f2e2;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Nanum Myeongjo', 'Apple SD Gothic Neo', 'Malgun Gothic', serif;
    background: radial-gradient(circle at 50% 20%, var(--bg-top) 0%, var(--bg-bottom) 70%);
    touch-action: manipulation;
  }

  .stage {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .envelope-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 0.45s ease, transform 0.45s ease;
  }

  .envelope-wrap.hidden {
    opacity: 0;
    transform: scale(0.92) translateY(8px);
    pointer-events: none;
  }

  #canvas-container {
    width: min(320px, 82vw);
    height: min(260px, 66vw);
    cursor: pointer;
    -webkit-mask-image: radial-gradient(ellipse 62% 62% at 50% 50%, #000 55%, transparent 100%);
    mask-image: radial-gradient(ellipse 62% 62% at 50% 50%, #000 55%, transparent 100%);
  }

  #canvas-container canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .hint {
    margin-top: 10px;
    font-family: 'Song Myung', serif;
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    transition: opacity 0.3s ease;
  }

  .envelope-wrap.hidden .hint {
    opacity: 0;
  }

  /* ---------- letter ---------- */
  .letter {
    position: absolute;
    width: 100%;
    max-width: 380px;
    padding: 0 24px;
    opacity: 0;
    transform: translateY(50px) rotate(0deg);
    pointer-events: none;
    transition: opacity 0.55s ease 0.15s, transform 0.55s cubic-bezier(.2,.8,.3,1) 0.15s;
  }

  .letter.show {
    opacity: 1;
    transform: translateY(0) rotate(-0.6deg);
    pointer-events: auto;
  }

  .letter-page {
    position: relative;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(176, 134, 63, 0.16), transparent 45%),
      radial-gradient(ellipse at 85% 90%, rgba(176, 134, 63, 0.16), transparent 45%),
      radial-gradient(ellipse at 80% 15%, rgba(122, 90, 40, 0.1), transparent 40%),
      linear-gradient(160deg, var(--paper) 0%, var(--paper-dark) 100%);
    padding: 40px 30px 34px;
    text-align: center;
    box-shadow:
      0 22px 45px rgba(60, 40, 15, 0.28),
      inset 0 0 40px rgba(122, 90, 40, 0.18);
    border: 1px solid rgba(122, 90, 40, 0.35);
    clip-path: polygon(
      1% 3%, 12% 0%, 28% 1.5%, 45% 0%, 63% 1.2%, 80% 0%, 97% 2%, 100% 12%,
      99% 30%, 100% 48%, 98.5% 66%, 100% 84%, 98% 97%, 85% 100%, 68% 98.5%,
      50% 100%, 33% 98.7%, 15% 100%, 2% 97%, 0% 82%, 1.5% 64%, 0% 46%, 1.2% 28%, 0% 12%
    );
  }

  .letter-page.result {
    display: none;
  }

  .letter-page.result.show {
    display: block;
  }

  .corner {
    position: absolute;
    width: 30px;
    height: 30px;
    opacity: 0.55;
    pointer-events: none;
  }
  .corner svg { width: 100%; height: 100%; }
  .corner.tl { top: 10px; left: 10px; }
  .corner.tr { top: 10px; right: 10px; transform: scaleX(-1); }
  .corner.bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
  .corner.br { bottom: 10px; right: 10px; transform: scale(-1, -1); }

  h1 {
    font-family: 'Song Myung', 'Nanum Myeongjo', serif;
    font-size: 24px;
    color: var(--ink);
    margin: 0 0 6px;
    line-height: 1.55;
    font-weight: 400;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  }

  h1 span {
    color: var(--wax);
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 66%;
    margin: 12px auto 20px;
  }
  .divider span {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold));
  }
  .divider span.right {
    background: linear-gradient(to left, transparent, var(--gold));
  }
  .divider i {
    width: 6px;
    height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
    display: inline-block;
    flex: none;
  }

  p.sub {
    font-size: 14.5px;
    color: var(--ink-soft);
    margin: 0 0 30px;
    line-height: 1.8;
    font-style: italic;
  }

  .button-zone {
    position: relative;
    min-height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  button.choice {
    border: none;
    font-family: 'Song Myung', 'Nanum Myeongjo', serif;
    font-size: 16.5px;
    padding: 14px 34px;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.15s ease;
    -webkit-user-select: none;
    user-select: none;
    white-space: nowrap;
    letter-spacing: 0.03em;
  }

  #likeBtn {
    background: linear-gradient(160deg, #8a2436, var(--wax));
    color: #f3e6c8;
    box-shadow: 0 8px 18px rgba(124, 31, 46, 0.4);
    border: 1px solid #5c141f;
  }

  #likeBtn:active {
    transform: scale(0.94);
  }

  #dislikeBtn {
    background: transparent;
    color: var(--ink-soft);
    border: 1.5px solid rgba(122, 90, 40, 0.45);
    position: relative;
    z-index: 2;
  }

  #dislikeBtn.fleeing {
    position: fixed;
    z-index: 999;
    background: var(--paper);
    transition: top 0.28s cubic-bezier(.2,.9,.3,1.3), left 0.28s cubic-bezier(.2,.9,.3,1.3);
  }

  .escape-count {
    margin-top: 16px;
    font-size: 13px;
    color: var(--wax);
    min-height: 18px;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="envelope-wrap" id="envelopeWrap">
    <div id="canvas-container"></div>
    <p class="hint" id="hint">봉랍을 눌러 편지를 열어보세요</p>
  </div>

  <div class="letter" id="letter">
    <div class="letter-page" id="mainCard">
      <div class="corner tl"><svg viewBox="0 0 40 40"><path d="M2 2 C 2 20, 20 2, 38 2" stroke="#b0863f" stroke-width="1.4" fill="none"/><path d="M2 2 C 2 14, 14 2, 26 2" stroke="#b0863f" stroke-width="1" fill="none"/></svg></div>
      <div class="corner tr"><svg viewBox="0 0 40 40"><path d="M2 2 C 2 20, 20 2, 38 2" stroke="#b0863f" stroke-width="1.4" fill="none"/><path d="M2 2 C 2 14, 14 2, 26 2" stroke="#b0863f" stroke-width="1" fill="none"/></svg></div>
      <div class="corner bl"><svg viewBox="0 0 40 40"><path d="M2 2 C 2 20, 20 2, 38 2" stroke="#b0863f" stroke-width="1.4" fill="none"/><path d="M2 2 C 2 14, 14 2, 26 2" stroke="#b0863f" stroke-width="1" fill="none"/></svg></div>
      <div class="corner br"><svg viewBox="0 0 40 40"><path d="M2 2 C 2 20, 20 2, 38 2" stroke="#b0863f" stroke-width="1.4" fill="none"/><path d="M2 2 C 2 14, 14 2, 26 2" stroke="#b0863f" stroke-width="1" fill="none"/></svg></div>

      <h1>이번 주 <span>토요일</span>,<br>나랑 데이트 할래?</h1>
      <div class="divider"><span></span><i></i><span class="right"></span></div>
      <p class="sub">용기 내서 물어봐요.<br>솔직한 마음으로 골라줘요.</p>

      <div class="button-zone" id="buttonZone">
        <button class="choice" id="likeBtn" onclick="onLike()">좋아</button>
        <button class="choice" id="dislikeBtn" onmouseenter="dodge(this)" ontouchstart="dodgeTouch(event, this)" onclick="return false;">싫어</button>
      </div>

      <div class="escape-count" id="escapeMsg"></div>
    </div>

    <div class="letter-page result" id="resultCard">
      <div class="corner tl"><svg viewBox="0 0 40 40"><path d="M2 2 C 2 20, 20 2, 38 2" stroke="#b0863f" stroke-width="1.4" fill="none"/></svg></div>
      <div class="corner tr"><svg viewBox="0 0 40 40"><path d="M2 2 C 2 20, 20 2, 38 2" stroke="#b0863f" stroke-width="1.4" fill="none"/></svg></div>
      <div class="corner bl"><svg viewBox="0 0 40 40"><path d="M2 2 C 2 20, 20 2, 38 2" stroke="#b0863f" stroke-width="1.4" fill="none"/></svg></div>
      <div class="corner br"><svg viewBox="0 0 40 40"><path d="M2 2 C 2 20, 20 2, 38 2" stroke="#b0863f" stroke-width="1.4" fill="none"/></svg></div>

      <h1>좋아! 이번 주 <span>토요일</span><br>만나요</h1>
      <div class="divider"><span></span><i></i><span class="right"></span></div>
      <p class="sub">기대할게요, 예쁘게 꾸미고 나올게요.<br>시간이랑 장소는 따로 말해줘요.</p>
    </div>
  </div>
</div>

<script>
  const dislikeBtn = document.getElementById('dislikeBtn');
  const likeBtn = document.getElementById('likeBtn');
  const escapeMsg = document.getElementById('escapeMsg');
  let dodgeCount = 0;

  const excuses = [
    '어딜 도망가~',
    '못 잡지롱',
    '싫어는 선택지에 없어요.',
    '헉 빨라',
    '오늘은 "좋아"만 있는 날이에요.',
    '포기하고 좋아 눌러줘요.'
  ];

  function getRandomPosition(btn) {
    const rect = btn.getBoundingClientRect();
    const margin = 16;
    const maxX = window.innerWidth - rect.width - margin;
    const maxY = window.innerHeight - rect.height - margin;
    const x = Math.max(margin, Math.random() * maxX);
    const y = Math.max(margin, Math.random() * maxY);
    return { x, y };
  }

  function moveButton(btn) {
    if (!btn.classList.contains('fleeing')) {
      const rect = btn.getBoundingClientRect();
      btn.style.width = rect.width + 'px';
      btn.classList.add('fleeing');
    }
    const { x, y } = getRandomPosition(btn);
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';

    dodgeCount++;
    escapeMsg.textContent = excuses[Math.min(dodgeCount - 1, excuses.length - 1)];

    const scale = Math.min(1 + dodgeCount * 0.06, 1.6);
    likeBtn.style.transform = `scale(${scale})`;
  }

  function dodge(btn) {
    moveButton(btn);
  }

  function dodgeTouch(e, btn) {
    e.preventDefault();
    moveButton(btn);
  }

  function onLike() {
    document.getElementById('mainCard').style.display = 'none';
    document.getElementById('resultCard').classList.add('show');
  }
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from 'three';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

  const container = document.getElementById('canvas-container');
  const envelopeWrap = document.getElementById('envelopeWrap');
  const letter = document.getElementById('letter');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(0, 0.35, 4.3);
  camera.lookAt(0, -0.05, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0xf8f2e2, 1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  const composer = new EffectComposer(renderer);
  const renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);
  const bloomPass = new UnrealBloomPass(new THREE.Vector2(300, 240), 0.16, 0.35, 0.92);
  composer.addPass(bloomPass);

  function resize() {
    const w = container.clientWidth;
    const h = container.clientHeight;
    renderer.setSize(w, h, false);
    composer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // ---------- aged parchment texture ----------
  function createParchmentTexture(base, blotch) {
    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 110; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 1024;
      const r = 30 + Math.random() * 140;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, blotch.replace('ALPHA', 0.14 + Math.random() * 0.12));
      grad.addColorStop(1, blotch.replace('ALPHA', 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    // fiber streaks
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 220; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 1024;
      const len = 10 + Math.random() * 40;
      const ang = Math.random() * Math.PI;
      ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(90,62,24,0.08)' : 'rgba(255,248,225,0.09)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
      ctx.stroke();
    }
    ctx.globalAlpha = 0.6;
    for (let i = 0; i < 1600; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 1024;
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(80,55,20,0.06)' : 'rgba(255,245,220,0.08)';
      ctx.fillRect(x, y, 1.2, 1.2);
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 4;
    return tex;
  }

  const parchmentTexBody = createParchmentTexture('#d9c188', 'rgba(150,110,50,ALPHA)');
  const parchmentTexPocket = createParchmentTexture('#c9ac72', 'rgba(120,85,35,ALPHA)');
  const parchmentTexFlapFront = createParchmentTexture('#d3b87d', 'rgba(140,100,45,ALPHA)');
  const parchmentTexFlapBack = createParchmentTexture('#b89a63', 'rgba(100,70,30,ALPHA)');

  // ---------- warm candlelit glow behind envelope ----------
  function createGlowTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    grad.addColorStop(0, 'rgba(255, 220, 150, 0.9)');
    grad.addColorStop(0.4, 'rgba(255, 200, 120, 0.35)');
    grad.addColorStop(1, 'rgba(255, 200, 120, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(canvas);
  }
  const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: createGlowTexture(),
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    opacity: 0.16
  }));
  glowSprite.scale.set(1.7, 1.7, 1);
  glowSprite.position.set(0, 0.05, 0.03);
  scene.add(glowSprite);

  // ---------- lighting ----------
  scene.add(new THREE.HemisphereLight(0xfff3d6, 0x8a6a3a, 0.9));
  const keyLight = new THREE.DirectionalLight(0xfff0d2, 0.95);
  keyLight.position.set(2.2, 3, 3.5);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(512, 512);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xd8b880, 0.3);
  fillLight.position.set(-2.5, -1, 2.5);
  scene.add(fillLight);
  const sealGlowLight = new THREE.PointLight(0xffb057, 0.12, 1.8, 2);
  sealGlowLight.position.set(0, 0.1, 0.5);
  scene.add(sealGlowLight);

  // ---------- envelope group ----------
  const W = 2.6, H = 1.7;
  const envelope = new THREE.Group();
  scene.add(envelope);

  const bodyMat = new THREE.MeshStandardMaterial({ map: parchmentTexBody, roughness: 0.9, metalness: 0.0 });
  const pocketMat = new THREE.MeshStandardMaterial({ map: parchmentTexPocket, roughness: 0.9, metalness: 0.0 });
  const flapFrontMat = new THREE.MeshStandardMaterial({ map: parchmentTexFlapFront, roughness: 0.88, metalness: 0.0, side: THREE.DoubleSide });
  const flapBackMat = new THREE.MeshStandardMaterial({ map: parchmentTexFlapBack, roughness: 0.92, metalness: 0.0, side: THREE.DoubleSide });

  function triangleShape(points) {
    const shape = new THREE.Shape();
    shape.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
    shape.closePath();
    return new THREE.ShapeGeometry(shape);
  }

  function raggedRectShape(w, h, jag) {
    const shape = new THREE.Shape();
    const hw = w / 2, hh = h / 2;
    const steps = 14;
    const pts = [];
    for (let i = 0; i <= steps; i++) pts.push([-hw + (w * i) / steps, -hh + (Math.random() - 0.5) * jag]);
    for (let i = 0; i <= steps; i++) pts.push([hw + (Math.random() - 0.5) * jag, -hh + (h * i) / steps]);
    for (let i = 0; i <= steps; i++) pts.push([hw - (w * i) / steps, hh + (Math.random() - 0.5) * jag]);
    for (let i = 0; i <= steps; i++) pts.push([-hw + (Math.random() - 0.5) * jag, hh - (h * i) / steps]);
    shape.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
    shape.closePath();
    return shape;
  }

  const body = new THREE.Mesh(new THREE.ShapeGeometry(raggedRectShape(W, H, 0.035)), bodyMat);
  body.position.z = -0.02;
  body.castShadow = true;
  envelope.add(body);

  const halfW = W / 2, halfH = H / 2;

  const leftPocketGeo = triangleShape([[-halfW, -halfH], [-halfW, 0], [0, -halfH]]);
  const leftPocket = new THREE.Mesh(leftPocketGeo, pocketMat);
  leftPocket.position.z = 0.01;
  envelope.add(leftPocket);

  const rightPocketGeo = triangleShape([[halfW, -halfH], [halfW, 0], [0, -halfH]]);
  const rightPocket = new THREE.Mesh(rightPocketGeo, pocketMat);
  rightPocket.position.z = 0.01;
  envelope.add(rightPocket);

  const flapHinge = new THREE.Group();
  flapHinge.position.set(0, halfH, 0.015);
  envelope.add(flapHinge);

  const flapDepth = H * 0.56;
  const flapFrontGeo = triangleShape([[-halfW, 0], [halfW, 0], [0, -flapDepth]]);
  const flapFront = new THREE.Mesh(flapFrontGeo, flapFrontMat);
  flapFront.position.z = 0.001;
  flapFront.castShadow = true;
  flapHinge.add(flapFront);

  const flapBack = new THREE.Mesh(flapFrontGeo, flapBackMat);
  flapBack.position.z = -0.001;
  flapBack.rotation.y = Math.PI;
  flapHinge.add(flapBack);

  const shadowGeo = new THREE.CircleGeometry(1.35, 32);
  const shadowMat = new THREE.MeshBasicMaterial({ color: 0x3b2b18, transparent: true, opacity: 0.18 });
  const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
  shadowMesh.position.set(0, -halfH - 0.45, -0.3);
  shadowMesh.scale.set(1, 0.34, 1);
  scene.add(shadowMesh);

  // ---------- burgundy wax seal ----------
  const sealGroup = new THREE.Group();
  flapHinge.add(sealGroup);
  sealGroup.position.set(0, -0.62, 0.02);

  const sealMat = new THREE.MeshStandardMaterial({ color: 0x7c1f2e, roughness: 0.32, metalness: 0.3 });
  const sealBase = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.075, 40), sealMat);
  sealBase.rotation.x = Math.PI / 2;
  sealBase.castShadow = true;
  sealGroup.add(sealBase);

  const dripMat = new THREE.MeshStandardMaterial({ color: 0x5c141f, roughness: 0.45, metalness: 0.24 });
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    const bump = new THREE.Mesh(new THREE.SphereGeometry(0.035 + Math.random() * 0.02, 8, 8), dripMat);
    bump.position.set(Math.cos(a) * 0.29, Math.sin(a) * 0.29, 0.01);
    sealGroup.add(bump);
  }

  const sealRingMat = new THREE.MeshStandardMaterial({ color: 0x4d1219, roughness: 0.4, metalness: 0.25 });
  const sealRing = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.016, 12, 32), sealRingMat);
  sealRing.position.z = 0.041;
  sealGroup.add(sealRing);

  function heartShape2D() {
    const s = new THREE.Shape();
    const x = 0, y = 0;
    s.moveTo(x + 0.25, y + 0.25);
    s.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
    s.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
    s.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 0.95);
    s.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
    s.bezierCurveTo(x + 0.8, y + 0.35, x + 0.8, y, x + 0.5, y);
    s.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);
    return s;
  }

  const heartGeo = new THREE.ShapeGeometry(heartShape2D());
  heartGeo.computeBoundingBox();
  const bb = heartGeo.boundingBox;
  const cx = (bb.max.x + bb.min.x) / 2;
  const cy = (bb.max.y + bb.min.y) / 2;
  heartGeo.translate(-cx, -cy, 0);
  const heartScale = 0.15;
  const heartMat = new THREE.MeshStandardMaterial({ color: 0xe8c98a, roughness: 0.35, metalness: 0.55, emissive: 0x1f1404, emissiveIntensity: 0.08 });
  const heartMesh = new THREE.Mesh(heartGeo, heartMat);
  heartMesh.scale.set(heartScale, heartScale, heartScale);
  heartMesh.rotation.z = Math.PI;
  heartMesh.position.z = 0.041;
  sealGroup.add(heartMesh);

  const hitTarget = new THREE.Mesh(
    new THREE.CircleGeometry(0.44, 24),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hitTarget.position.z = 0.06;
  hitTarget.userData.isSeal = true;
  sealGroup.add(hitTarget);

  // ---------- sparkle burst ----------
  const sparkleCount = 46;
  const sparkleGeo = new THREE.BufferGeometry();
  const sparklePos = new Float32Array(sparkleCount * 3);
  const sparkleVel = [];
  for (let i = 0; i < sparkleCount; i++) {
    sparklePos.set([0, 0, 0], i * 3);
    const ang = Math.random() * Math.PI * 2;
    const speed = 0.5 + Math.random() * 1.4;
    sparkleVel.push({
      x: Math.cos(ang) * speed,
      y: Math.sin(ang) * speed + 0.6,
      z: (Math.random() - 0.5) * 1.2
    });
  }
  sparkleGeo.setAttribute('position', new THREE.BufferAttribute(sparklePos, 3));
  const sparkleMat = new THREE.PointsMaterial({
    color: 0xf3d98a,
    size: 0.045,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const sparkles = new THREE.Points(sparkleGeo, sparkleMat);
  sparkles.position.copy(new THREE.Vector3(0, halfH - 0.62, 0.06));
  scene.add(sparkles);
  let sparkleActive = false;
  let sparkleStart = 0;

  function burstSparkles() {
    const posAttr = sparkleGeo.getAttribute('position');
    for (let i = 0; i < sparkleCount; i++) posAttr.setXYZ(i, 0, 0, 0);
    posAttr.needsUpdate = true;
    sparkleActive = true;
    sparkleStart = performance.now();
  }

  // ---------- interaction ----------
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let opened = false;

  function onPointerDown(event) {
    if (opened) return;
    const rect = renderer.domElement.getBoundingClientRect();
    const clientX = event.touches ? event.touches[0].clientX : event.clientX;
    const clientY = event.touches ? event.touches[0].clientY : event.clientY;
    pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);
    const intersects = raycaster.intersectObject(hitTarget, false);
    if (intersects.length > 0) {
      openEnvelope();
    }
  }
  renderer.domElement.addEventListener('pointerdown', onPointerDown);

  let animState = null;

  function openEnvelope() {
    if (opened) return;
    opened = true;
    animState = { start: performance.now() };
    burstSparkles();
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }
  function easeInCubic(t) {
    return t * t * t;
  }

  const clock = new THREE.Clock();
  let domFadeTriggered = false;
  let lastTime = 0;

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    const dt = Math.min(t - lastTime, 0.05);
    lastTime = t;

    if (!opened) {
      envelope.rotation.y = Math.sin(t * 0.9) * 0.05;
      envelope.position.y = Math.sin(t * 1.3) * 0.03;
    }

    sealGlowLight.intensity = 0.12 + Math.sin(t * 2.2) * 0.03;
    glowSprite.material.opacity = 0.1 + Math.sin(t * 1.6) * 0.02;

    if (animState) {
      const elapsed = performance.now() - animState.start;

      const sealT = Math.min(elapsed / 380, 1);
      const sealEase = easeInCubic(sealT);
      sealGroup.scale.setScalar(1 - sealEase);

      const flapDelay = 120;
      const flapT = Math.min(Math.max(elapsed - flapDelay, 0) / 650, 1);
      const flapEase = easeOutCubic(flapT);
      flapHinge.rotation.x = -flapEase * (Math.PI * 0.92);

      if (elapsed > 700 && !domFadeTriggered) {
        domFadeTriggered = true;
        envelopeWrap.classList.add('hidden');
        letter.classList.add('show');
      }

      if (elapsed > 1400) {
        animState = null;
      }
    }

    if (sparkleActive) {
      const se = (performance.now() - sparkleStart) / 1000;
      const posAttr = sparkleGeo.getAttribute('position');
      for (let i = 0; i < sparkleCount; i++) {
        const v = sparkleVel[i];
        posAttr.setXYZ(i, v.x * se, v.y * se - 0.9 * se * se, v.z * se);
      }
      posAttr.needsUpdate = true;
      sparkleMat.opacity = Math.max(0, 1 - se / 1.1);
      if (se > 1.1) sparkleActive = false;
    } else {
      sparkleMat.opacity = 0;
    }

    composer.render();
  }

  resize();
  animate();
</script>

</body>
