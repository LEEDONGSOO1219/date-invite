<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>이번주 토요일, 데이트 할래?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3a2c22;
    --ink-soft: #8a7a68;
    --seal: #7c1f2e;
    --paper: #fffdf6;
    --paper-line: #ece2cf;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Nanum Myeongjo', 'Apple SD Gothic Neo', 'Malgun Gothic', serif;
    background: #ffffff;
    touch-action: manipulation;
  }

  .stage {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .envelope-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 0.45s ease, transform 0.45s ease;
  }

  .envelope-wrap.hidden {
    opacity: 0;
    transform: scale(0.92) translateY(8px);
    pointer-events: none;
  }

  #canvas-container {
    width: min(300px, 78vw);
    height: min(240px, 62vw);
    cursor: pointer;
  }

  #canvas-container canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .hint {
    margin-top: 10px;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    transition: opacity 0.3s ease;
  }

  .envelope-wrap.hidden .hint {
    opacity: 0;
  }

  /* ---------- letter ---------- */
  .letter {
    position: absolute;
    width: 100%;
    max-width: 380px;
    padding: 0 24px;
    opacity: 0;
    transform: translateY(50px);
    pointer-events: none;
    transition: opacity 0.55s ease 0.15s, transform 0.55s cubic-bezier(.2,.8,.3,1) 0.15s;
  }

  .letter.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .letter-page {
    background: var(--paper);
    border-radius: 4px;
    padding: 40px 28px 32px;
    text-align: center;
    box-shadow:
      0 20px 45px rgba(80, 55, 25, 0.16),
      0 2px 0 rgba(0,0,0,0.02);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 27px,
      var(--paper-line) 28px
    );
  }

  .letter-page.result {
    display: none;
  }

  .letter-page.result.show {
    display: block;
  }

  h1 {
    font-size: 24px;
    color: var(--ink);
    margin: 0 0 12px;
    line-height: 1.5;
    font-weight: 800;
  }

  h1 span {
    color: var(--seal);
  }

  p.sub {
    font-size: 14.5px;
    color: var(--ink-soft);
    margin: 0 0 34px;
    line-height: 1.75;
  }

  .button-zone {
    position: relative;
    min-height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  button.choice {
    border: none;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 700;
    padding: 14px 32px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease;
    -webkit-user-select: none;
    user-select: none;
    white-space: nowrap;
  }

  #likeBtn {
    background: var(--seal);
    color: #fff8f0;
  }

  #likeBtn:active {
    transform: scale(0.95);
  }

  #dislikeBtn {
    background: transparent;
    color: var(--ink-soft);
    border: 1.5px solid var(--paper-line);
    position: relative;
    z-index: 2;
  }

  #dislikeBtn.fleeing {
    position: fixed;
    z-index: 999;
    background: var(--paper);
    transition: top 0.28s cubic-bezier(.2,.9,.3,1.3), left 0.28s cubic-bezier(.2,.9,.3,1.3);
  }

  .escape-count {
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--ink-soft);
    min-height: 18px;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="envelope-wrap" id="envelopeWrap">
    <div id="canvas-container"></div>
    <p class="hint" id="hint">도장을 눌러 편지를 열어보세요</p>
  </div>

  <div class="letter" id="letter">
    <div class="letter-page" id="mainCard">
      <h1>이번 주 <span>토요일</span>,<br>나랑 데이트 할래?</h1>
      <p class="sub">용기 내서 물어봐요.<br>솔직한 마음으로 골라줘요.</p>

      <div class="button-zone" id="buttonZone">
        <button class="choice" id="likeBtn" onclick="onLike()">좋아</button>
        <button class="choice" id="dislikeBtn" onmouseenter="dodge(this)" ontouchstart="dodgeTouch(event, this)" onclick="return false;">싫어</button>
      </div>

      <div class="escape-count" id="escapeMsg"></div>
    </div>

    <div class="letter-page result" id="resultCard">
      <h1>좋아! 이번 주 <span>토요일</span><br>만나요</h1>
      <p class="sub">기대할게요, 예쁘게 꾸미고 나올게요.<br>시간이랑 장소는 따로 말해줘요.</p>
    </div>
  </div>
</div>

<script>
  const dislikeBtn = document.getElementById('dislikeBtn');
  const likeBtn = document.getElementById('likeBtn');
  const escapeMsg = document.getElementById('escapeMsg');
  let dodgeCount = 0;

  const excuses = [
    '어딜 도망가~',
    '못 잡지롱',
    '싫어는 선택지에 없어요.',
    '헉 빨라',
    '오늘은 "좋아"만 있는 날이에요.',
    '포기하고 좋아 눌러줘요.'
  ];

  function getRandomPosition(btn) {
    const rect = btn.getBoundingClientRect();
    const margin = 16;
    const maxX = window.innerWidth - rect.width - margin;
    const maxY = window.innerHeight - rect.height - margin;
    const x = Math.max(margin, Math.random() * maxX);
    const y = Math.max(margin, Math.random() * maxY);
    return { x, y };
  }

  function moveButton(btn) {
    if (!btn.classList.contains('fleeing')) {
      const rect = btn.getBoundingClientRect();
      btn.style.width = rect.width + 'px';
      btn.classList.add('fleeing');
    }
    const { x, y } = getRandomPosition(btn);
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';

    dodgeCount++;
    escapeMsg.textContent = excuses[Math.min(dodgeCount - 1, excuses.length - 1)];

    const scale = Math.min(1 + dodgeCount * 0.06, 1.6);
    likeBtn.style.transform = `scale(${scale})`;
  }

  function dodge(btn) {
    moveButton(btn);
  }

  function dodgeTouch(e, btn) {
    e.preventDefault();
    moveButton(btn);
  }

  function onLike() {
    document.getElementById('mainCard').style.display = 'none';
    document.getElementById('resultCard').classList.add('show');
  }
</script>

<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

  const container = document.getElementById('canvas-container');
  const envelopeWrap = document.getElementById('envelopeWrap');
  const letter = document.getElementById('letter');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(0, 0.05, 4.4);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  container.appendChild(renderer.domElement);

  function resize() {
    const w = container.clientWidth;
    const h = container.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // ---------- lighting ----------
  scene.add(new THREE.HemisphereLight(0xfff6e8, 0xcbb98f, 1.0));
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
  keyLight.position.set(2.2, 3, 3.5);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xffe9cf, 0.35);
  fillLight.position.set(-2.5, -1, 2.5);
  scene.add(fillLight);

  // ---------- envelope group ----------
  const W = 2.6, H = 1.7;
  const envelope = new THREE.Group();
  scene.add(envelope);

  const colorBody = 0xf1e6cb;
  const colorPocket = 0xddccA4 & 0xffffff; // ensure valid hex
  const colorFlapFront = 0xe9dbb9;
  const colorFlapBack = 0xd8c69c;

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf1e6cb, roughness: 0.85, metalness: 0.02 });
  const pocketMat = new THREE.MeshStandardMaterial({ color: 0xddcaa0, roughness: 0.85, metalness: 0.02 });
  const flapFrontMat = new THREE.MeshStandardMaterial({ color: 0xe9dbb9, roughness: 0.8, metalness: 0.02, side: THREE.DoubleSide });
  const flapBackMat = new THREE.MeshStandardMaterial({ color: 0xcdb98d, roughness: 0.9, metalness: 0.02, side: THREE.DoubleSide });

  // back body panel
  const body = new THREE.Mesh(new THREE.PlaneGeometry(W, H), bodyMat);
  body.position.z = -0.02;
  envelope.add(body);

  // bottom pockets (triangular folds)
  function triangleShape(points) {
    const shape = new THREE.Shape();
    shape.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
    shape.closePath();
    return new THREE.ShapeGeometry(shape);
  }

  const halfW = W / 2, halfH = H / 2;

  const leftPocketGeo = triangleShape([[-halfW, -halfH], [-halfW, 0], [0, -halfH]]);
  const leftPocket = new THREE.Mesh(leftPocketGeo, pocketMat);
  leftPocket.position.z = 0.01;
  envelope.add(leftPocket);

  const rightPocketGeo = triangleShape([[halfW, -halfH], [halfW, 0], [0, -halfH]]);
  const rightPocket = new THREE.Mesh(rightPocketGeo, pocketMat);
  rightPocket.position.z = 0.01;
  envelope.add(rightPocket);

  // top flap, hinged along top edge
  const flapHinge = new THREE.Group();
  flapHinge.position.set(0, halfH, 0.015);
  envelope.add(flapHinge);

  const flapDepth = H * 0.56;
  const flapFrontGeo = triangleShape([[-halfW, 0], [halfW, 0], [0, -flapDepth]]);
  const flapFront = new THREE.Mesh(flapFrontGeo, flapFrontMat);
  flapFront.position.z = 0.001;
  flapHinge.add(flapFront);

  const flapBack = new THREE.Mesh(flapFrontGeo, flapBackMat);
  flapBack.position.z = -0.001;
  flapBack.rotation.y = Math.PI;
  flapHinge.add(flapBack);

  // soft contact shadow under envelope
  const shadowGeo = new THREE.CircleGeometry(1.35, 32);
  const shadowMat = new THREE.MeshBasicMaterial({ color: 0x3a2c22, transparent: true, opacity: 0.14 });
  const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
  shadowMesh.position.set(0, -halfH - 0.45, -0.3);
  shadowMesh.scale.set(1, 0.34, 1);
  scene.add(shadowMesh);

  // ---------- wax seal ----------
  const sealGroup = new THREE.Group();
  sealGroup.position.set(0, 0.18, 0.06);
  flapHinge.add(sealGroup);
  // note: seal is attached to flapHinge so it stays glued to the flap as it opens,
  // matching where a real wax seal sits on the envelope flap.
  sealGroup.position.set(0, -0.62, 0.02);

  const sealMat = new THREE.MeshStandardMaterial({ color: 0x7c1f2e, roughness: 0.4, metalness: 0.25 });
  const sealBase = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.28, 0.07, 32), sealMat);
  sealBase.rotation.x = Math.PI / 2;
  sealGroup.add(sealBase);

  const sealRingMat = new THREE.MeshStandardMaterial({ color: 0x5c141f, roughness: 0.5, metalness: 0.2 });
  const sealRing = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.02, 12, 32), sealRingMat);
  sealRing.position.z = 0.041;
  sealGroup.add(sealRing);

  const sealMarkMat = new THREE.MeshStandardMaterial({ color: 0x5c141f, roughness: 0.5, metalness: 0.2 });
  const sealMark = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.01), sealMarkMat);
  sealMark.rotation.z = Math.PI / 4;
  sealMark.position.z = 0.041;
  sealGroup.add(sealMark);

  // invisible larger hit-target for easier tapping on mobile
  const hitTarget = new THREE.Mesh(
    new THREE.CircleGeometry(0.42, 24),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hitTarget.position.z = 0.05;
  hitTarget.userData.isSeal = true;
  sealGroup.add(hitTarget);

  // ---------- interaction ----------
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let opened = false;

  function onPointerDown(event) {
    if (opened) return;
    const rect = renderer.domElement.getBoundingClientRect();
    const clientX = event.touches ? event.touches[0].clientX : event.clientX;
    const clientY = event.touches ? event.touches[0].clientY : event.clientY;
    pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);
    const intersects = raycaster.intersectObject(hitTarget, false);
    if (intersects.length > 0) {
      openEnvelope();
    }
  }
  renderer.domElement.addEventListener('pointerdown', onPointerDown);

  let animState = null; // { start, phase }

  function openEnvelope() {
    if (opened) return;
    opened = true;
    animState = { start: performance.now() };
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }
  function easeInCubic(t) {
    return t * t * t;
  }

  const clock = new THREE.Clock();
  let domFadeTriggered = false;

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    if (!opened) {
      envelope.rotation.y = Math.sin(t * 0.9) * 0.05;
      envelope.position.y = Math.sin(t * 1.3) * 0.03;
    }

    if (animState) {
      const elapsed = performance.now() - animState.start;

      const sealT = Math.min(elapsed / 380, 1);
      const sealEase = easeInCubic(sealT);
      sealGroup.scale.setScalar(1 - sealEase);
      sealGroup.position.z = -0.62 * 0 + (0.02 + sealEase * 0.5);

      const flapDelay = 120;
      const flapT = Math.min(Math.max(elapsed - flapDelay, 0) / 650, 1);
      const flapEase = easeOutCubic(flapT);
      flapHinge.rotation.x = -flapEase * (Math.PI * 0.92);

      if (elapsed > 700 && !domFadeTriggered) {
        domFadeTriggered = true;
        envelopeWrap.classList.add('hidden');
        letter.classList.add('show');
      }

      if (elapsed > 1400) {
        animState = null;
      }
    }

    renderer.render(scene, camera);
  }

  resize();
  animate();
</script>

</body>
</html>
